---
- name: Smartctl Exporter | Install and build dependecies
  ansible.builtin.apt:
    name:
      - build-essential
      - git
      - smartmontools
    state: present
    update_cache: true

- name: Smartctl Exporter | Ensure Go is installed
  ansible.builtin.stat:
    path: /usr/local/go/bin/go
  register: smartctl_exporter_go_binary

- name: Smartctl Exporter | Fail if Go is not installed
  ansible.builtin.fail:
    msg: "Go is not installed. Please install Go before running this playbook."
  when: not smartctl_exporter_go_binary.stat.exists

- name: Smartctl Exporter | Create install directory
  ansible.builtin.file:
    path: /opt/smartctl_exporter
    state: directory
    mode: '0755'

- name: Smartctl Exporter | Clone repository
  ansible.builtin.git:
    repo: "https://github.com/prometheus-community/smartctl_exporter.git"
    dest: /opt/smartctl_exporter/src
    version: "v{{ smartctl_exporter_version }}"

- name: Smartctl Exporter | Build binary
  ansible.builtin.command: make build
  args:
    chdir: /opt/smartctl_exporter/src
    creates: /opt/smartctl_exporter/src/smartctl_exporter
  environment:
    PATH: "/usr/local/go/bin:{{ ansible_env.PATH }}"

- name: Smartctl Exporter | Install binary
  ansible.builtin.copy:
    src: /opt/smartctl_exporter/src/smartctl_exporter
    dest: /usr/local/bin/smartctl_exporter
    mode: '0755'
    remote_src: true

- name: Smartctl Exporter | Deploy systemd service
  ansible.builtin.template:
    src: smartctl_exporter.service.j2
    dest: /etc/systemd/system/smartctl_exporter.service
    mode: '0644'
  notify: Restart smartctl_exporter

- name: Smartctl Exporter | Enable and start service
  ansible.builtin.systemd:
    name: smartctl_exporter
    enabled: true
    state: started
    daemon_reload: true
