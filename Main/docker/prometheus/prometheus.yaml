global:
  scrape_interval: 15s
scrape_configs:
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx_exporter:9113']
  - job_name: 'server-node'
    static_configs: [{ targets: ['192.168.178.88:9100'] }]
  - job_name: 'server-ipmi'
    static_configs: [{ targets: ['192.168.178.88:9290'] }]
  - job_name: 'server-smart'
    static_configs: [{ targets: ['192.168.178.88:9633'] }]
  - job_name: 'server-process'
    static_configs: [{ targets: ['192.168.178.88:9256'] }]
  - job_name: 'minecraft'
    static_configs: [{ targets: ['192.168.178.88:19565'] }]
  - job_name: 'pi-node'
    static_configs: [{ targets: ['192.168.178.141:9100'] }]
  - job_name: 'pi-smart'
    static_configs: [{ targets: ['192.168.178.141:9633'] }]
  - job_name: 'homeassistant'
    metrics_path: /api/prometheus
    scheme: http
    bearer_token_file: /etc/prometheus/secrets/ha_token
    static_configs:
      - targets: ['192.168.178.39:8123']