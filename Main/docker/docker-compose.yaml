services:
  prometheus:
    image: prom/prometheus
    ports:
      - '9090:9090'
    volumes:
      - ./prometheus:/etc/prometheus
      - ./prometheus/secrets:/etc/prometheus/secrets:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yaml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-admin-api'
    restart: always

  loki:
    image: grafana/loki:3.7.3
    container_name: loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    ports: 
      - "3100:3100"

  grafana:
    image: grafana/grafana
    ports:
      - '3000:3000'
    depends_on:
      - prometheus
    restart: always
    environment:
      - GF_SMTP_PASSWORD=${GRAFANA_SMTP_PASSWORD}
    volumes:
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini
      - ./grafana/provisioning/alerting:/etc/grafana/provisioning/alerting
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

  web_server:
    image: nginx
    volumes:
      - ./templates:/etc/nginx/templates
    ports:
      - '8080:80'
    restart: always

  nginx_exporter:
    image: nginx/nginx-prometheus-exporter:latest
    command:
      - '-nginx.scrape-uri=http://web_server:80/nginx_status'
    ports:
      - '9113:9113'
    depends_on:
      - web_server
    restart: always

  ansible:
    build: .
    container_name: ansible
    working_dir: /ansible
    volumes:
      - ${SSH_DIR}:/root/.ssh:ro
      - ../ansible:/ansible
    environment:
      - ANSIBLE_HOST_KEY_CHECKING=False
    entrypoint: ["ansible-playbook"]
    command: ["deploy.yaml", "-i", "inventory/inventory.ini"]
    labels:
      ofelia.enabled: "false"

  scheduler:
    image: mcuadros/ofelia:latest
    depends_on:
      - ansible
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      ofelia.job-run.ansible-nightly.schedule: "0 0 2 * * *"
      ofelia.job-run.ansible-nightly.container: "ansible"

volumes:
  grafana-data:
  prometheus-data:
  loki-data:
