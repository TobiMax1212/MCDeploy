- name: Go | Check if Go is already installed
  ansible.builtin.stat:
    path: /usr/local/go/bin/go
  register: go_binary

- name: Go | Download tarball
  ansible.builtin.get_url:
    url: "https://go.dev/dl/go{{ go_version }}.linux-{{ go_arch_map[ansible_architecture] }}.tar.gz"
    dest: "/tmp/go{{ go_version }}.linux-{{ go_arch_map[ansible_architecture] }}.tar.gz"
    mode: '0644'
  when: not go_binary.stat.exists

- name: Go | Extract to /usr/local
  ansible.builtin.unarchive:
    src: "/tmp/go{{ go_version }}.linux-{{ go_arch_map[ansible_architecture] }}.tar.gz"
    dest: /usr/local
    remote_src: true
  when: not go_binary.stat.exists

- name: Go | Ensure Go ist in system-wide PATH
  ansible.builtin.copy:
    dest: /etc/profile.d/go.sh
    content: 'export PATH=$PATH:/usr/local/go/bin'
    mode: '0644'
