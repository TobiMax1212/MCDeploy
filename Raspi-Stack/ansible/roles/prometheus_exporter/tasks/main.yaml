---
- name: Node Exporter | Create Directory
  ansible.builtin.file:
    path: /opt/node_exporter
    state: directory
    mode: "0755"

- name: Node Exporter | Download binary
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/node_exporter/releases/download/v{{ prometheus_exporter_version }}/node_exporter-{{ prometheus_exporter_version }}.linux-amd64.tar.gz"
    dest: /tmp/node_exporter.tar.gz
    mode: "0644"

- name: Node Exporter | Extract binary
  ansible.builtin.unarchive:
    src: /tmp/node_exporter.tar.gz
    dest: /opt/node_exporter
    remote_src: true
    extra_opts:
      - --strip-components=1

- name: Systemd | Create service file
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    mode: "0644"
  notify: Node_exporter reboot

- name: Systemd | Enable and start service
  ansible.builtin.systemd:
    name: node_exporter
    enabled: true
    state: started
    daemon_reload: true
