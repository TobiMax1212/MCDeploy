apiVersion: 1
groups:
- orgId: 1
  name: infra-1m
  folder: 'TobisServer: Infra Alerts'
  interval: 1m
  rules:
  - uid: infra-cpu-load-high
    title: CPU Load High
    condition: C
    data:
    - refId: A
      queryType: ''
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: cfuhki39ptv5sf
      model:
        datasource:
          type: prometheus
          uid: cfuhki39ptv5sf
        editorMode: code
        expr: avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        refId: A
    - refId: B
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: '-100'
      model:
        conditions:
        - evaluator:
            params:
            - 0
            type: gt
          operator:
            type: and
          query:
            params:
            - B
          reducer:
            params: []
            type: last
          type: query
        datasource:
          type: __expr__
          uid: '-100'
        expression: A
        reducer: last
        refId: B
        type: reduce
    - refId: C
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: '-100'
      model:
        conditions:
        - evaluator:
            params:
            - 20
            type: lt
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            params: []
            type: last
          type: query
        datasource:
          type: __expr__
          uid: '-100'
        expression: B
        type: threshold
        refId: C
    noDataState: NoData
    execErrState: Error
    for: 5m
    annotations:
      summary: CPU-Auslastung ist hoch
      description: Idle-CPU liegt unter 20% (d.h. Last > 80%) seit 5 Minuten auf TobisServer.
    labels:
      severity: warning
    notification_settings:
      receiver: Grafana-Warning
  - uid: infra-ram-usage-high
    title: RAM Usage High
    condition: C
    data:
    - refId: A
      queryType: ''
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: cfuhki39ptv5sf
      model:
        datasource:
          type: prometheus
          uid: cfuhki39ptv5sf
        editorMode: code
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        refId: A
    - refId: B
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: '-100'
      model:
        conditions:
        - evaluator:
            params:
            - 0
            type: gt
          operator:
            type: and
          query:
            params:
            - B
          reducer:
            params: []
            type: last
          type: query
        datasource:
          type: __expr__
          uid: '-100'
        expression: A
        reducer: last
        refId: B
        type: reduce
    - refId: C
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: '-100'
      model:
        conditions:
        - evaluator:
            params:
            - 90
            type: gt
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            params: []
            type: last
          type: query
        datasource:
          type: __expr__
          uid: '-100'
        expression: B
        type: threshold
        refId: C
    noDataState: NoData
    execErrState: Error
    for: 5m
    annotations:
      summary: RAM-Nutzung ist hoch
      description: Verfügbarer Speicher liegt unter 10% auf TobisServer.
    labels:
      severity: warning
    notification_settings:
      receiver: Grafana-Warning
  - uid: infra-disk-space-low
    title: Disk Space Low
    condition: C
    data:
    - refId: A
      queryType: ''
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: cfuhki39ptv5sf
      model:
        datasource:
          type: prometheus
          uid: cfuhki39ptv5sf
        editorMode: code
        expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) * 100
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        refId: A
    - refId: B
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: '-100'
      model:
        conditions:
        - evaluator:
            params:
            - 0
            type: gt
          operator:
            type: and
          query:
            params:
            - B
          reducer:
            params: []
            type: last
          type: query
        datasource:
          type: __expr__
          uid: '-100'
        expression: A
        reducer: last
        refId: B
        type: reduce
    - refId: C
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: '-100'
      model:
        conditions:
        - evaluator:
            params:
            - 10
            type: lt
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            params: []
            type: last
          type: query
        datasource:
          type: __expr__
          uid: '-100'
        expression: B
        type: threshold
        refId: C
    noDataState: NoData
    execErrState: Error
    for: 5m
    annotations:
      summary: Freier Speicherplatz wird knapp
      description: Freier Speicherplatz auf einem Filesystem liegt unter 10%.
    labels:
      severity: critical
    notification_settings:
      receiver: Grafana-Critical
  - uid: infra-disk-space-critical
    title: Disk Space Critical
    condition: C
    data:
    - refId: A
      queryType: ''
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: cfuhki39ptv5sf
      model:
        datasource:
          type: prometheus
          uid: cfuhki39ptv5sf
        editorMode: code
        expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) * 100
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        refId: A
    - refId: B
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: '-100'
      model:
        conditions:
        - evaluator:
            params:
            - 0
            type: gt
          operator:
            type: and
          query:
            params:
            - B
          reducer:
            params: []
            type: last
          type: query
        datasource:
          type: __expr__
          uid: '-100'
        expression: A
        reducer: last
        refId: B
        type: reduce
    - refId: C
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: '-100'
      model:
        conditions:
        - evaluator:
            params:
            - 5
            type: lt
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            params: []
            type: last
          type: query
        datasource:
          type: __expr__
          uid: '-100'
        expression: B
        type: threshold
        refId: C
    noDataState: NoData
    execErrState: Error
    for: 2m
    annotations:
      summary: Freier Speicherplatz kritisch niedrig
      description: Freier Speicherplatz auf einem Filesystem liegt unter 5%. Sofort handeln.
    labels:
      severity: critical
    notification_settings:
      receiver: Grafana-Critical
  - uid: infra-node-down
    title: Node Down
    condition: C
    data:
    - refId: A
      queryType: ''
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: cfuhki39ptv5sf
      model:
        datasource:
          type: prometheus
          uid: cfuhki39ptv5sf
        editorMode: code
        expr: up{job="server-node"}
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        refId: A
    - refId: B
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: '-100'
      model:
        conditions:
        - evaluator:
            params:
            - 0
            type: gt
          operator:
            type: and
          query:
            params:
            - B
          reducer:
            params: []
            type: last
          type: query
        datasource:
          type: __expr__
          uid: '-100'
        expression: A
        reducer: last
        refId: B
        type: reduce
    - refId: C
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: '-100'
      model:
        conditions:
        - evaluator:
            params:
            - 1
            type: lt
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            params: []
            type: last
          type: query
        datasource:
          type: __expr__
          uid: '-100'
        expression: B
        type: threshold
        refId: C
    noDataState: NoData
    execErrState: Error
    for: 1m
    annotations:
      summary: TobisServer nicht erreichbar
      description: node_exporter auf TobisServer antwortet nicht mehr (Prometheus-Scrape fehlgeschlagen).
    labels:
      severity: critical
    notification_settings:
      receiver: Grafana-Critical
